<!doctype html><html lang="en"><meta charset="utf-8"><title>Duvi chat DOM regression tests</title>
<h1>Chat DOM tests</h1><pre id="results"></pre><main id="fixture"></main>
<script type="module">
import {ChatPanel} from '../../src/learning-chat.mjs';
import {TimeStrip} from '../../src/learning-timeline.mjs';
const results=[],root=document.querySelector('#fixture');
const eq=(a,b)=>{if(a!==b)throw Error(`expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);};
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
async function check(name,run){root.replaceChildren();try{await run();results.push({name,passed:true});}catch(e){results.push({name,passed:false,message:e.message});}}
function panel(overrides={}){
  const record={id:'r',lectureId:'1',revision:3,question:'Q',explanation:'old',anchor:{seconds:7},reviews:[]};
  const state={chats:[],records:[record]};
  const chat=new ChatPanel(root,{capture:()=>({lectureId:'1'}),time:()=>7,getState:()=>state,...overrides});
  chat.sync();return {chat,record,state};
}
await check('A legacy text draft uses the saved record revision',async()=>{
  let version;
  const {chat}=panel({saveExplanation:async(_item,_text,_help,revision)=>{version=revision;}});
  chat.drafts['record:r']='legacy draft';root.querySelector('.chat-link').click();
  eq(root.querySelector('.chat-mine-edit textarea').value,'legacy draft');
  root.querySelector('.chat-mine-edit [type=submit]').click();await tick();eq(version,3);
});
await check('A stale draft requires latest → compare → a second save',async()=>{
  const latest={id:'r',revision:4,explanation:'edited elsewhere'};const calls=[];
  const {chat}=panel({latestExplanation:async()=>latest,saveExplanation:async(item,text,help,version)=>{
    calls.push({record:item.record,text,version});if(version!==4)throw Object.assign(Error('conflict'),{status:409});
  }});
  chat.drafts={};root.querySelector('.chat-link').click();const input=root.querySelector('.chat-mine-edit textarea');
  input.value='my draft';input.dispatchEvent(new Event('input'));const save=root.querySelector('.chat-mine-edit [type=submit]');save.click();await tick();
  eq(calls.length,1);eq(calls[0].version,3);eq(input.value,'my draft');let action=root.querySelector('.chat-mine-notice button');eq(action.textContent,'최신 저장본 확인');
  action.click();await tick();const notice=root.querySelector('.chat-mine-notice');eq(notice.textContent.includes(latest.explanation),true);
  action=notice.querySelector('button');eq(action.textContent,'비교했어요 · 이 초안으로 저장 준비');action.click();eq(calls.length,1);
  save.click();await tick();eq(calls.length,2);eq(calls[1].version,4);eq(calls[1].record,latest);eq(calls[1].text,'my draft');
});
await check('Starter buttons keep keyboard focus as playback advances',()=>{
  const {state,chat}=panel();state.records=[];chat.sync();const starter=root.querySelector('.chat-starters button');
  starter.focus();chat.tick(8);chat.tick(9);eq(document.activeElement,starter);
});
await check('Equal span counts across lectures still update the last option',()=>{
  const strip=new TimeStrip(root,{jump(){}});strip.set([],1100);eq(strip.range.options[1].textContent,'10:00–18:20');
  strip.set([],1120);eq(strip.range.options[1].textContent,'10:00–18:40');
});
document.querySelector('#results').textContent=JSON.stringify(results,null,2);
document.documentElement.dataset.result=results.every(row=>row.passed)?'pass':'fail';
</script></html>
